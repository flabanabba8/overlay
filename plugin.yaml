name: overlay
version: "0.1.0"
description: "Agent file edits go to a shadow copy first; review a per-hunk diff and apply only what you approve to the real files."
author: "Overlay contributors"
license: GPL-3.0-or-later
requires_hermes: ">=0.22.0"
provides_tools:
  - overlay_start
  - overlay_status
  - overlay_diff
  - overlay_apply
  - overlay_discard
provides_hooks:
  - pre_tool_call
  - transform_tool_result
